<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><title>帳務計算器｜手機版</title>
<style>
:root{--bg:#0b1220;--panel:#142136;--panel2:#0f1b2c;--line:#293b53;--text:#eef4fc;--muted:#91a3ba;--green:#45d49a;--red:#ff788c;--blue:#79adff;--amber:#f5c15c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom))}
header{padding:20px 2px 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#528cf5,#38c995);display:grid;place-items:center;color:#071322;font-size:22px;font-weight:900}.eyebrow{font-size:10px;letter-spacing:.14em;color:var(--muted)}h1{font-size:22px;margin:1px 0 0}.iconbtn{background:#1a2a40;border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:11px;font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.panel{background:linear-gradient(160deg,#192a41,#121e30);border:1px solid var(--line);border-radius:16px}.stat{padding:14px}.stat small{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:23px;margin-top:5px;font-variant-numeric:tabular-nums}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}
.panel{padding:16px;margin-top:13px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}h2{font-size:16px;margin:0}.field{margin-bottom:11px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}input,select{width:100%;background:#0b1727;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:13px 12px;font:inherit;font-size:16px;outline:none}input:focus,select:focus{border-color:var(--blue)}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hint{font-size:11px;color:var(--muted);margin:0 0 12px}
button{font:inherit;cursor:pointer} .primary{width:100%;padding:13px;border:0;border-radius:11px;background:#347be8;color:white;font-weight:700;font-size:15px}.secondary{background:#1b2d45;color:var(--text);border:1px solid var(--line);padding:9px 11px;border-radius:10px;font-size:13px}.danger{color:#ff9aaa}.balance{margin-top:12px;padding:12px;border:1px solid var(--line);background:#0c1929;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.balance small{display:block;color:var(--muted);font-size:11px}.balance strong{font-size:14px}.balance button{white-space:nowrap;background:#245fba;border:0;border-radius:9px;color:white;padding:10px;font-size:12px}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.count{font-size:11px;color:var(--muted);background:#20344e;padding:4px 8px;border-radius:99px}.entry{background:#0c1929;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px}.entrytop{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-weight:700;overflow-wrap:anywhere}.value{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.memo{color:var(--muted);font-size:12px;margin-top:5px;overflow-wrap:anywhere}.entryactions{display:flex;gap:7px;margin-top:10px}.entryactions button{padding:7px 10px;border-radius:8px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:13px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.tools button{padding:11px;border-radius:10px;background:#1a2a40;color:var(--text);border:1px solid var(--line);font-size:13px}.foot{color:#71839a;text-align:center;font-size:11px;padding:17px 4px}.substats{display:flex;justify-content:space-between;gap:8px;margin-top:10px;color:var(--muted);font-size:12px}.substats b{color:var(--text);font-variant-numeric:tabular-nums}
@media(min-width:600px){body{padding:18px 0}.app{border:1px solid #26364c;border-radius:22px;min-height:90vh;padding:18px}}
</style></head>
<body><div class="app">
<header><div class="brand"><div class="logo">Σ</div><div><div class="eyebrow">PERSONAL LEDGER</div><h1>帳務計算器</h1></div></div><button class="iconbtn" id="csv">匯出備份</button></header>
<section class="stats">
<div class="stat"><small>贏錢總額</small><strong class="green" id="pos">$0</strong></div>
<div class="stat"><small>輸錢總額</small><strong class="red" id="neg">$0</strong></div>
<div class="stat"><small>目前差額</small><strong class="blue" id="net">$0</strong></div>
<div class="stat"><small>帳目筆數</small><strong id="count">0</strong></div>
</section>
<section class="panel">
<div class="panelhead"><h2 id="formtitle">新增帳目</h2><span class="count">同名自動合併</span></div>
<form id="form">
<div class="field"><label for="person">姓名</label><input id="person" maxlength="40" placeholder="輸入姓名" required></div>
<div class="two"><div class="field"><label for="amount">金額</label><input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="輸入金額" required></div><div class="field"><label for="direction">方向</label><select id="direction"><option value="plus">贏錢（+）</option><option value="minus">輸錢（−）</option></select></div></div>
<div class="field"><label for="memo">備註（選填）</label><input id="memo" maxlength="100" placeholder="備註"></div>
<p class="hint">輸入姓名、金額，再選擇贏錢或輸錢。</p>
<button class="primary" id="save" type="submit">＋ 新增帳目</button><button class="secondary" id="cancel" type="button" style="display:none;width:100%;margin-top:8px">取消編輯</button>
</form>
<div class="substats"><span>合併後贏錢 <b id="gpos">$0</b></span><span>合併後輸錢 <b id="gneg">$0</b></span></div>
<div class="balance"><div><small>平帳所需補差額</small><strong id="balance">目前已平帳</strong></div><button id="balancebtn">自動補差額</button></div>
</section>
<section class="panel">
<div class="panelhead listhead"><h2>帳目明細 <span class="count" id="pill">0 筆</span></h2><button class="secondary" id="view">合併檢視</button></div>
<div id="entries"><div class="empty">目前沒有帳目，先新增一筆吧。</div></div>
<div class="tools"><button id="copy">複製結帳清單</button><button id="clear" class="danger">清空帳目</button></div>
</section>
<div class="foot">資料儲存在目前瀏覽器。換手機或清除瀏覽資料前，請先匯出備份。</div>
</div>
<script>
(()=>{const $=id=>document.getElementById(id),KEY='ledger-calculator-v1';let data=[],edit=null,merged=false;
try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch{data=[]}
const total=()=>data.reduce((s,x)=>s+x.value,0),fmt=n=>(n<0?'−$':'$')+Math.abs(n).toLocaleString('zh-TW'),sgn=n=>(n>0?'+':n<0?'−':'')+Math.abs(n).toLocaleString('zh-TW');
const groups=()=>{let m=new Map();data.forEach(x=>m.set(x.name,(m.get(x.name)||0)+x.value));return [...m].map(([name,value])=>({name,value})).filter(x=>x.value!==0)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function render(){let p=data.reduce((s,x)=>s+Math.max(0,x.value),0),n=data.reduce((s,x)=>s+Math.max(0,-x.value),0),t=total(),g=groups();$('pos').textContent=fmt(p);$('neg').textContent=fmt(n);$('net').textContent=(t>0?'+':'')+fmt(t);$('net').className='blue';$('count').textContent=data.length;$('pill').textContent=data.length+' 筆';$('gpos').textContent=fmt(g.reduce((s,x)=>s+Math.max(0,x.value),0));$('gneg').textContent=fmt(g.reduce((s,x)=>s+Math.max(0,-x.value),0));$('balance').textContent=t?'需補 '+sgn(-t):'目前已平帳';$('balancebtn').disabled=!t;$('balancebtn').style.opacity=t?1:.45;
let list=merged?g:data;$('view').textContent=merged?'明細檢視':'合併檢視';
$('entries').innerHTML=list.length?list.map(x=>{let val=x.value;return `<article class="entry"><div class="entrytop"><span class="name">${esc(x.name)}</span><span class="value ${val>0?'green':'red'}">${sgn(val)}</span></div>${!merged&&x.memo?`<div class="memo">${esc(x.memo)}</div>`:''}${!merged?`<div class="entryactions"><button class="secondary" data-edit="${x.id}">編輯</button><button class="secondary danger" data-del="${x.id}">刪除</button></div>`:''}</article>`}).join(''):'<div class="empty">目前沒有帳目，先新增一筆吧。</div>'}
function reset(){edit=null;$('form').reset();$('formtitle').textContent='新增帳目';$('save').textContent='＋ 新增帳目';$('cancel').style.display='none'}
$('form').onsubmit=e=>{e.preventDefault();let name=$('person').value.trim(),a=Number($('amount').value);if(!name||!Number.isFinite(a)||a<=0){alert('請輸入姓名及大於 0 的金額');return}let obj={name,value:Math.round(a)*($('direction').value==='minus'?-1:1),memo:$('memo').value.trim()};if(edit){let i=data.findIndex(x=>x.id===edit);if(i>=0)data[i]={...data[i],...obj}}else data.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),...obj});save();reset();render()};
$('entries').onclick=e=>{let id=e.target.dataset.edit,del=e.target.dataset.del;if(id){let x=data.find(v=>v.id===id);edit=id;$('person').value=x.name;$('amount').value=Math.abs(x.value);$('direction').value=x.value<0?'minus':'plus';$('memo').value=x.memo||'';$('formtitle').textContent='編輯帳目';$('save').textContent='儲存修改';$('cancel').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('確定刪除這筆帳目？')){data=data.filter(x=>x.id!==del);save();if(edit===del)reset();render()}};
$('cancel').onclick=reset;$('view').onclick=()=>{merged=!merged;render()};
$('balancebtn').onclick=()=>{let d=-total();if(!d)return;data.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:'補差額',value:d,memo:'自動補平帳'});save();render()};
$('copy').onclick=async()=>{let g=groups(),p=g.reduce((s,x)=>s+Math.max(0,x.value),0),n=g.reduce((s,x)=>s+Math.max(0,-x.value),0),t=total(),lines=g.map(x=>x.name+' '+sgn(x.value));lines.push('',`贏錢總額：${p}`,`輸錢總額：${n}`,`差額：${sgn(t)}`,t?'補差額：'+sgn(-t):'總帳：0，完全平帳');try{await navigator.clipboard.writeText(lines.join('\n'));alert('結帳清單已複製')}catch{prompt('請複製以下內容',lines.join('\n'))}};
function csv(){let rows=[['姓名','金額','備註'],...data.map(x=>[x.name,x.value,x.memo||''])],s='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),b=new Blob([s],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='帳務明細.csv';a.click();URL.revokeObjectURL(u)}
$('csv').onclick=csv;$('clear').onclick=()=>{if(confirm('確定清空所有帳目？建議先匯出備份。')){data=[];save();reset();render()}};render();
})();
</script></body></html>
