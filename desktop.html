<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>帳務計算器｜電腦版</title>
<style>
:root{--bg:#0b1220;--panel:#121f32;--panel2:#0d1929;--line:#293c55;--text:#edf4ff;--muted:#91a3ba;--green:#45d49a;--red:#ff788c;--blue:#80b2ff;--accent:#347be8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -30%,#1b3555 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-width:760px}.wrap{max-width:1440px;margin:auto;padding:30px 38px 50px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#528cf5,#38c995);display:grid;place-items:center;color:#071322;font-size:25px;font-weight:900}h1{font-size:25px;margin:0}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--muted)}.subtitle{color:var(--muted);font-size:13px;margin-top:3px}.head-actions{display:flex;gap:9px}button{font:inherit;cursor:pointer}.btn{border:1px solid var(--line);background:#1a2b42;color:var(--text);border-radius:10px;padding:10px 14px;font-size:13px}.btn:hover{filter:brightness(1.15)}.btn.primary{background:var(--accent);border-color:var(--accent);font-weight:700}.btn.danger{color:#ff9aaa}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.stat,.panel{background:linear-gradient(155deg,#17283f,#111e30);border:1px solid var(--line);border-radius:17px;box-shadow:0 12px 30px #0002}.stat{padding:19px 21px}.stat small{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:29px;margin-top:6px;font-variant-numeric:tabular-nums}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}
.layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px;align-items:start}.panel{padding:21px}.panel h2{font-size:17px;margin:0}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.field{margin-bottom:14px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}input,select{width:100%;background:#0a1727;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 13px;font:inherit;outline:none}input:focus,select:focus{border-color:var(--blue)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hint{font-size:11px;color:var(--muted);margin:0 0 15px}.wide{width:100%;padding:13px}.balance{margin-top:17px;padding:15px;background:#0c1929;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.balance small{display:block;color:var(--muted);font-size:11px}.balance strong{font-size:16px}.right{min-width:0}.listpanel{min-height:470px}.listtools{display:flex;align-items:center;gap:8px}.count{font-size:11px;color:var(--muted);background:#20344e;padding:5px 9px;border-radius:99px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;text-align:left}th{background:#0d1a2b;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;padding:13px 15px;white-space:nowrap}td{padding:14px 15px;border-top:1px solid #24364d;font-size:13px}tbody tr:hover{background:#ffffff06}.amount{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}.actions{display:flex;gap:7px}.actions button{font-size:11px;padding:6px 9px}.empty{text-align:center;color:var(--muted);padding:45px 12px}.summary{display:flex;justify-content:space-between;gap:15px;color:var(--muted);font-size:12px;margin-top:14px}.summary b{color:var(--text);font-variant-numeric:tabular-nums}.footer{color:#71839a;text-align:center;font-size:11px;margin-top:22px}.mode{display:flex;gap:7px;align-items:center}
@media(max-width:950px){.wrap{padding:22px 18px}.layout{grid-template-columns:310px minmax(0,1fr)}.stats{gap:9px}.stat{padding:15px}.stat strong{font-size:23px}}
</style></head><body><main class="wrap">
<header><div class="brand"><div class="logo">Σ</div><div><div class="eyebrow">PERSONAL LEDGER · DESKTOP</div><h1>帳務計算器</h1><div class="subtitle">清楚管理每一筆收支，快速完成結帳</div></div></div><div class="head-actions"><button class="btn" id="csv">匯出 CSV</button><button class="btn" id="copy">複製結帳清單</button><a class="btn" href="./" style="text-decoration:none">手機版</a></div></header>
<section class="stats"><div class="stat"><small>贏錢總額</small><strong class="green" id="pos">$0</strong></div><div class="stat"><small>輸錢總額</small><strong class="red" id="neg">$0</strong></div><div class="stat"><small>目前差額</small><strong class="blue" id="net">$0</strong></div><div class="stat"><small>帳目筆數</small><strong id="count">0</strong></div></section>
<div class="layout"><section class="panel"><div class="panelhead"><h2 id="formtitle">新增帳目</h2><span class="count">NEW ENTRY</span></div><form id="form"><div class="field"><label for="person">姓名</label><input id="person" maxlength="40" placeholder="輸入姓名" required></div><div class="two"><div class="field"><label for="amount">金額</label><input id="amount" type="number" min="1" step="1" placeholder="輸入金額" required></div><div class="field"><label for="direction">方向</label><select id="direction"><option value="plus">贏錢（+）</option><option value="minus">輸錢（−）</option></select></div></div><div class="field"><label for="memo">備註（選填）</label><input id="memo" maxlength="100" placeholder="輸入備註"></div><p class="hint">同一姓名會自動合併計算總額。</p><button class="btn primary wide" id="save" type="submit">＋ 新增帳目</button><button class="btn wide" id="cancel" type="button" style="display:none;margin-top:8px">取消編輯</button></form><div class="summary"><span>合併贏錢 <b id="gpos">$0</b></span><span>合併輸錢 <b id="gneg">$0</b></span></div><div class="balance"><div><small>平帳所需補差額</small><strong id="balance">目前已平帳</strong></div><button class="btn primary" id="balancebtn">自動補差額</button></div></section>
<section class="panel right listpanel"><div class="panelhead"><div><h2>帳目明細</h2><div class="subtitle" style="margin-top:4px">查看、編輯及管理所有紀錄</div></div><div class="listtools"><span class="count" id="pill">0 筆</span><button class="btn" id="view">合併檢視</button></div></div><div class="tablewrap"><table><thead><tr><th>姓名</th><th>金額</th><th>方向</th><th>備註</th><th>操作</th></tr></thead><tbody id="entries"><tr><td colspan="5" class="empty">目前沒有帳目，先新增一筆吧。</td></tr></tbody></table></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn danger" id="clear">清空所有帳目</button></div></section></div>
<div class="footer">資料儲存在目前瀏覽器（與同一瀏覽器的手機版頁面共用）；不同裝置不會自動同步，請定期匯出 CSV 備份。</div></main>
<script>
(()=>{const $=id=>document.getElementById(id),KEY='ledger-calculator-v1';let data=[],edit=null,merged=false;try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch{data=[]}
const total=()=>data.reduce((s,x)=>s+x.value,0),fmt=n=>(n<0?'−$':'$')+Math.abs(n).toLocaleString('zh-TW'),sgn=n=>(n>0?'+':n<0?'−':'')+Math.abs(n).toLocaleString('zh-TW'),groups=()=>{let m=new Map();data.forEach(x=>m.set(x.name,(m.get(x.name)||0)+x.value));return [...m].map(([name,value])=>({name,value})).filter(x=>x.value!==0)},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function render(){let p=data.reduce((s,x)=>s+Math.max(0,x.value),0),n=data.reduce((s,x)=>s+Math.max(0,-x.value),0),t=total(),g=groups();$('pos').textContent=fmt(p);$('neg').textContent=fmt(n);$('net').textContent=(t>0?'+':'')+fmt(t);$('count').textContent=data.length;$('pill').textContent=data.length+' 筆';$('gpos').textContent=fmt(g.reduce((s,x)=>s+Math.max(0,x.value),0));$('gneg').textContent=fmt(g.reduce((s,x)=>s+Math.max(0,-x.value),0));$('balance').textContent=t?'需補 '+sgn(-t):'目前已平帳';$('balancebtn').disabled=!t;$('balancebtn').style.opacity=t?1:.45;$('view').textContent=merged?'明細檢視':'合併檢視';
let list=merged?g:data;$('entries').innerHTML=list.length?list.map(x=>{let v=x.value;return '<tr><td><b>'+esc(x.name)+'</b></td><td class="amount '+(v>0?'green':'red')+'">'+sgn(v)+'</td><td>'+(v>0?'<span class="green">贏錢</span>':'<span class="red">輸錢</span>')+'</td><td style="color:var(--muted)">'+(merged?'—':esc(x.memo||'—'))+'</td><td>'+(merged?'—':'<div class="actions"><button class="btn" data-edit="'+x.id+'">編輯</button><button class="btn danger" data-del="'+x.id+'">刪除</button></div>')+'</td></tr>'}).join(''):'<tr><td colspan="5" class="empty">目前沒有帳目，先新增一筆吧。</td></tr>'}
function reset(){$('form').reset();edit=null;$('formtitle').textContent='新增帳目';$('save').textContent='＋ 新增帳目';$('cancel').style.display='none'}
$('form').onsubmit=e=>{e.preventDefault();let name=$('person').value.trim(),a=Number($('amount').value);if(!name||!Number.isFinite(a)||a<=0){alert('請輸入姓名及大於 0 的金額');return}let obj={name,value:Math.round(a)*($('direction').value==='minus'?-1:1),memo:$('memo').value.trim()};if(edit){let i=data.findIndex(x=>x.id===edit);if(i>=0)data[i]={...data[i],...obj}}else data.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),...obj});save();reset();render()};
$('entries').onclick=e=>{let id=e.target.dataset.edit,del=e.target.dataset.del;if(id){let x=data.find(v=>v.id===id);edit=id;$('person').value=x.name;$('amount').value=Math.abs(x.value);$('direction').value=x.value<0?'minus':'plus';$('memo').value=x.memo||'';$('formtitle').textContent='編輯帳目';$('save').textContent='儲存修改';$('cancel').style.display='block';$('person').focus()}if(del&&confirm('確定刪除這筆帳目？')){data=data.filter(x=>x.id!==del);save();if(edit===del)reset();render()}};
$('cancel').onclick=reset;$('view').onclick=()=>{merged=!merged;render()};$('balancebtn').onclick=()=>{let d=-total();if(!d)return;data.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:'補差額',value:d,memo:'自動補平帳'});save();render()};
$('copy').onclick=async()=>{let g=groups(),p=g.reduce((s,x)=>s+Math.max(0,x.value),0),n=g.reduce((s,x)=>s+Math.max(0,-x.value),0),t=total(),lines=g.map(x=>x.name+' '+sgn(x.value));lines.push('',`贏錢總額：${p}`,`輸錢總額：${n}`,`差額：${sgn(t)}`,t?'補差額：'+sgn(-t):'總帳：0，完全平帳');try{await navigator.clipboard.writeText(lines.join('\n'));alert('結帳清單已複製')}catch{prompt('請複製以下內容',lines.join('\n'))}};
$('csv').onclick=()=>{let rows=[['姓名','金額','備註'],...data.map(x=>[x.name,x.value,x.memo||''])],s='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),b=new Blob([s],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='帳務明細.csv';a.click();URL.revokeObjectURL(u)};
$('clear').onclick=()=>{if(confirm('確定清空所有帳目？建議先匯出備份。')){data=[];save();reset();render()}};render();
})();
</script></body></html>
